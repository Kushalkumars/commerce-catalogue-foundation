server {
  listen 80;
  root /usr/share/nginx/html;
  # Docker's embedded DNS. Without this, nginx caches the api host
  # from startup and keeps proxying to an old address after a recreate.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
